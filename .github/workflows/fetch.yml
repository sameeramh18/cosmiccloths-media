name: Fetch exported designs
on:
  push:
    paths: ['fetch/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p fetch/out
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -o "fetch/out/$name" "$url" && echo "ok $name" || echo "FAIL $name"
          done < fetch/urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fetch/out
          git commit -m "Fetched exported designs" || echo "nothing new"
          git push
